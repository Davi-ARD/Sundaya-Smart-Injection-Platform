services:
  db:
    image: postgres:16
    container_name: mold-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mold
      POSTGRES_PASSWORD: mold
      POSTGRES_DB: mold_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
